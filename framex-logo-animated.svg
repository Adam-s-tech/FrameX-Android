<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">FrameX</title>
  <!-- Delete the <rect id="bg"> for a transparent animated logo -->
  <style>
    :root { --ink:#FFFFFF; --bg:#0A0A0A; --draw:cubic-bezier(.65,0,.35,1); }
    .stroke { fill:none; stroke:var(--ink); stroke-width:50; stroke-linejoin:miter; stroke-miterlimit:10; stroke-linecap:butt;
              stroke-dasharray:100; stroke-dashoffset:100; }
    #frame { animation: draw .65s var(--draw) .10s forwards; }
    #x     { animation: draw .60s var(--draw) .55s forwards; }
    #glow  { opacity:0; animation: pulse .70s ease-out 1.05s forwards; }
    #glow .stroke { stroke-width:56; animation: none; stroke-dashoffset:0; }
    #logo  { transform-origin:512px 512px; animation: settle .50s ease-out 1.05s both; }
    @keyframes draw   { to { stroke-dashoffset:0; } }
    @keyframes pulse  { 0%{opacity:0} 35%{opacity:.9} 100%{opacity:0} }
    @keyframes settle { 0%{transform:scale(1)} 40%{transform:scale(1.025)} 100%{transform:scale(1)} }
    @media (prefers-reduced-motion: reduce) {
      .stroke { animation:none !important; stroke-dashoffset:0 !important; }
      #glow, #logo { animation:none !important; }
    }
  </style>
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect id="bg" width="1024" height="1024" fill="var(--bg)"/>
  <g id="logo">
    <g id="glow" filter="url(#blur)"><path class="stroke" pathLength="100" d="M270.0 304.3 L270.0 337.6 L445.5 512.0 L270.0 686.4 L270.0 753.0 L354.0 753.0 L512.0 581.0 L670.0 753.0 L753.0 753.0 L753.0 686.2 L583.1 512.0 L753.0 337.8 L753.0 271.0 L669.8 271.0 L512.0 439.6 L354.2 271.0 L270.0 271.0 Z"/></g>
    <path id="frame" class="stroke" pathLength="100" d="M308 512 H128 V128 H896 V896 H128 V512"/>
    <path id="x" class="stroke" pathLength="100" d="M270.0 304.3 L270.0 337.6 L445.5 512.0 L270.0 686.4 L270.0 753.0 L354.0 753.0 L512.0 581.0 L670.0 753.0 L753.0 753.0 L753.0 686.2 L583.1 512.0 L753.0 337.8 L753.0 271.0 L669.8 271.0 L512.0 439.6 L354.2 271.0 L270.0 271.0 Z"/>
  </g>
</svg>
